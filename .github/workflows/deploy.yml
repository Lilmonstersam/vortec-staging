name: Deploy Vortec staging mockup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate pages and assets
        run: |
          node --check script.js
          node --check site-header.js
          python3 scripts/check_site.py
      - name: Build Pages artifact
        run: |
          mkdir _site
          cp index.html style.css script.js shared-header.css site-header.js preview-nav.css .nojekyll _site/
          cp -R assets vx2000 hydromulching-services _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
